<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tabac : vrai ou faux ?</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
</head>
<body>
<style>
:root{--bleu:#3558a2;--rose:#e61a7c;--vert:#3f9e83;--jaune:#f2b417;--ink:#23273a;--muted:#646a82;--line:#dde2ee;--bg:#f4f6fb}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.5}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid #1a8fcc;outline-offset:2px}
.top{background:var(--bleu);color:#fff;padding:14px 16px 16px;position:relative;overflow:hidden}
.top::after{content:"";position:absolute;right:-50px;top:-60px;width:160px;height:160px;border-radius:50%;background:var(--rose)}
.top .in{position:relative;z-index:1;max-width:640px;margin:0 auto}
.top small{display:block;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#ffd4e8}
.top b{font-size:17px}
main{max-width:640px;margin:0 auto;padding:18px 16px 40px;display:grid;gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px 18px;box-shadow:0 8px 22px rgba(30,40,80,.07);display:grid;gap:14px;text-align:center}
h1{font-size:clamp(30px,8vw,44px);line-height:1.1;margin:0;color:var(--bleu)}
h1 span{color:var(--rose)}
.lead{margin:0;color:var(--muted)}
.pills{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.pills span{background:#eef1f8;border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600}
.btn{border:0;border-radius:14px;padding:15px 22px;font-weight:700;font-size:18px;background:var(--bleu);color:#fff;width:100%}
.btn.rose{background:var(--rose)}.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.vert{background:var(--vert)}
.dots{display:flex;justify-content:center;gap:6px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--rose)}
.qn{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.qq{font-size:clamp(21px,5.4vw,28px);font-weight:700;color:var(--ink);line-height:1.3;min-height:110px;display:grid;place-items:center}
.vf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vf button{border:0;border-radius:16px;padding:22px 10px;font-size:24px;font-weight:700;color:#fff}
.ans{border-radius:16px;padding:14px 16px;text-align:left}
.ans.ok{background:color-mix(in srgb,var(--vert) 15%,#fff)}.ans.ko{background:color-mix(in srgb,var(--rose) 10%,#fff)}
.ans b{font-size:19px}.ans p{margin:6px 0 0}
.score{font-size:64px;font-weight:700;color:var(--bleu);line-height:1}
.score small{font-size:26px;color:var(--muted)}
.help{background:color-mix(in srgb,var(--jaune) 22%,#fff);border-radius:16px;padding:14px 16px;text-align:left}
.help b{color:var(--bleu)}
.tel{display:block;font-size:30px;font-weight:700;color:var(--rose);text-decoration:none;margin-top:4px}
.two{display:grid;gap:10px}
.foot{font-size:12.5px;color:var(--muted);text-align:center}
.borne .qq{font-size:clamp(26px,3.6vw,40px)}
@media (min-width:900px){.borne main{max-width:900px}.borne .vf button{padding:34px 10px;font-size:34px}}
@media (prefers-reduced-motion:no-preference){.card{animation:up .25s ease}@keyframes up{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}}
</style>
<header class="top"><div class="in"><small>Mois sans tabac 2026</small><b id="mspName">Votre maison de santé</b></div></header>
<main id="app" aria-live="polite"></main>
<p class="foot">Anonyme : aucun nom, aucune donnée personnelle n’est demandée.<br>Sources : Assurance maladie, Tabac info service, FEMAS Hauts-de-France.</p>

<script src="config.js"></script>
<script>
(function(){
const CONFIG=Object.assign({BACKEND:""},window.AM_CONFIG||{});
/* ======================= liaison avec le Google Sheets de la FEMAS =======================
   CONFIG.BACKEND :
     ""      → rien n’est envoyé, tout reste sur l’ordinateur
     "demo"  → démonstration : un faux serveur dans ce navigateur (pour tester)
     "https://script.google.com/macros/s/…/exec" → le vrai réservoir FEMAS */
const DEMO_KEY="amdemo-db";
const Demo={
 db(){try{return JSON.parse(localStorage.getItem(DEMO_KEY))||{etat:{},msp:{},quiz:[]};}catch(e){return {etat:{},msp:{},quiz:[]};}},
 put(d){try{localStorage.setItem(DEMO_KEY,JSON.stringify(d));}catch(e){}},
 get(p){const d=Demo.db();const c=String(p.code||"").toUpperCase();
  if(p.action==="load")return {ok:!!d.etat[c],state:d.etat[c]||null};
  if(p.action==="exists")return {ok:true,exists:!!d.etat[c]};
  if(p.action==="count")return {ok:true,count:Object.keys(d.msp).length};
  if(p.action==="quizstats"){const r=d.quiz.filter(x=>x.code===c);const n=r.length;const q=[0,0,0,0,0,0,0,0];let tot=0,parler=0;
   r.forEach(x=>{tot+=+x.score||0;x.answers.forEach((a,i)=>{if(a===true)q[i]++;});if(x.parler)parler++;});
   return {ok:true,n,avg:n?tot/n:0,correct:q.map(v=>n?v/n:0),parler};}
  return {ok:true};},
 post(b){const d=Demo.db();const c=String(b.code||"").toUpperCase();if(!c)return {ok:false};
  if(b.action==="save"){d.etat[c]=b.state;d.msp[c]={msp:b.state&&b.state.msp,at:new Date().toISOString()};Demo.put(d);return {ok:true,savedAt:new Date().toISOString()};}
  if(b.action==="quiz"){d.quiz.push({code:c,answers:(b.answers||[]).slice(0,8),score:+b.score||0,parler:!!b.parler,t:Date.now()});Demo.put(d);return {ok:true};}
  return {ok:false};}
};
const API={
 on:()=>!!CONFIG.BACKEND,
 async get(params){if(CONFIG.BACKEND==="demo"){await new Promise(r=>setTimeout(r,150));return Demo.get(params);}
  const r=await fetch(CONFIG.BACKEND+"?"+new URLSearchParams(params).toString());return r.json();},
 async post(body){if(CONFIG.BACKEND==="demo"){await new Promise(r=>setTimeout(r,250));return Demo.post(body);}
  const r=await fetch(CONFIG.BACKEND,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});return r.json();},
 beacon(body){if(CONFIG.BACKEND==="demo"){Demo.post(body);return true;}
  try{return navigator.sendBeacon(CONFIG.BACKEND,new Blob([JSON.stringify(body)],{type:"text/plain;charset=utf-8"}));}catch(e){return false;}}
};

const QUIZ=[
 ["Arrêter de fumer 6 à 8 semaines avant une opération divise par 3 le risque de complications opératoires.",true,"Un arrêt 6 à 8 semaines avant l’intervention, poursuivi pendant la cicatrisation, est l’idéal. Mais arrêter est bénéfique jusqu’à la veille de l’opération."],
 ["Quel que soit l’âge, il y a toujours des bénéfices à arrêter de fumer.",true,"Le risque cardiovasculaire baisse quel que soit l’âge de l’arrêt, même après 70 ans. Les premiers bénéfices sont quasi immédiats : il n’est jamais trop tard."],
 ["La prise de poids est systématique quand on arrête de fumer.",false,"Elle n’est pas systématique et reste souvent limitée, notamment avec les substituts nicotiniques."],
 ["Un mois sans fumer, c’est 5 fois plus de chances d’arrêter définitivement.",true,"Après 30 jours d’abstinence, la dépendance est moins forte et les symptômes de manque diminuent."],
 ["Les substituts nicotiniques sont remboursés à 65 % par l’Assurance maladie.",true,"Depuis le 1er janvier 2019, sur prescription. La complémentaire santé peut prendre en charge le reste."],
 ["Seul le médecin peut prescrire des substituts nicotiniques.",false,"Les sages-femmes, infirmiers, masseurs-kinésithérapeutes et chirurgiens-dentistes peuvent aussi les prescrire."],
 ["Réduire de moitié sa consommation avec des substituts nicotiniques diminue déjà certains risques.",true,"La réduction a des effets positifs et peut préparer une tentative d’arrêt. Mais l’objectif reste l’arrêt complet."],
 ["On peut se faire accompagner par des tabacologues au 39 89.",true,"Tabac info service propose un accompagnement personnalisé par téléphone, sur son site et son application."]];

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const P=new URLSearchParams(location.search);
const CODE=String(P.get("m")||"").toUpperCase().replace(/[^A-Z0-9-]/g,"").slice(0,40);
const NAME=(P.get("n")||"").slice(0,80);
const BORNE=P.get("borne")==="1";
if(BORNE)document.body.classList.add("borne");
if(NAME){$("mspName").textContent=NAME;document.title="Tabac : vrai ou faux ? · "+NAME;}
let S={i:-1,ans:[],cur:null,sent:false},idle=null;
function send(parler){if(S.sent||!CODE||!CONFIG.BACKEND)return;S.sent=true;
 const body={action:"quiz",code:CODE,answers:S.ans,score:S.ans.filter(Boolean).length,parler:!!parler};
 API.post(body).catch(()=>API.beacon(body));}
window.addEventListener("pagehide",()=>{if(!S.sent&&S.ans.length===QUIZ.length&&CODE&&CONFIG.BACKEND){S.sent=true;API.beacon({action:"quiz",code:CODE,answers:S.ans,score:S.ans.filter(Boolean).length,parler:false});}});
function arm(sec){clearTimeout(idle);if(BORNE)idle=setTimeout(()=>{if(S.ans.length===QUIZ.length)send(false);S={i:-1,ans:[],cur:null,sent:false};render();},sec*1000);}
function render(){const el=$("app");
 if(S.i<0){el.innerHTML=`<div class="card"><h1>Tabac :<br><span>vrai ou faux ?</span></h1><p class="lead">Testez vos connaissances sur le tabac et l’arrêt.</p><div class="pills"><span>8 questions</span><span>2 minutes</span><span>Anonyme</span></div><button class="btn rose" id="go">Commencer</button></div>`;
  $("go").onclick=()=>{S.i=0;render();};clearTimeout(idle);return;}
 if(S.i<QUIZ.length){const q=QUIZ[S.i];const a=S.cur;
  el.innerHTML=`<div class="card"><div class="qn">Question ${S.i+1} sur ${QUIZ.length}</div><div class="dots">${QUIZ.map((_,i)=>`<i class="${i<=S.i?"on":""}"></i>`).join("")}</div>
   <div class="qq">${esc(q[0])}</div>
   ${a===null?`<div class="vf"><button style="background:var(--vert)" data-a="1">VRAI</button><button style="background:var(--rose)" data-a="0">FAUX</button></div>`
   :`<div class="ans ${a===q[1]?"ok":"ko"}"><b>${a===q[1]?"Bravo !":"Pas tout à fait…"} C’est ${q[1]?"VRAI":"FAUX"}.</b><p>${esc(q[2])}</p></div><button class="btn" id="next">${S.i<QUIZ.length-1?"Question suivante →":"Voir mon résultat"}</button>`}</div>`;
  el.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{S.cur=b.dataset.a==="1";S.ans[S.i]=S.cur===q[1];render();});
  if($("next"))$("next").onclick=()=>{S.i++;S.cur=null;render();window.scrollTo(0,0);};arm(90);return;}
 const sc=S.ans.filter(Boolean).length;
 if(S.done===undefined){el.innerHTML=`<div class="card"><div class="qn">Votre résultat</div><div class="score">${sc}<small> / ${QUIZ.length}</small></div><p class="lead">${sc>=7?"Excellent, vous êtes incollable !":sc>=5?"Bien joué : vous en savez déjà beaucoup.":"Merci d’avoir joué : vous en savez plus maintenant !"}</p>
  <div class="help"><b>Aimeriez-vous en parler avec un professionnel de la maison de santé ?</b><p style="margin:6px 0 0;font-size:15px">Votre réponse reste anonyme : elle nous aide seulement à savoir combien de patients souhaitent de l’aide.</p></div>
  <div class="two"><button class="btn vert" data-p="1">Oui, j’aimerais en parler</button><button class="btn alt" data-p="0">Non merci</button></div></div>`;
  el.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{S.done=b.dataset.p==="1";send(S.done);render();});arm(45);return;}
 el.innerHTML=`<div class="card">${S.done?`<h1 style="font-size:28px">Bonne décision !</h1><p class="lead" style="color:var(--ink)">Parlez-en lors de votre prochain rendez-vous : médecin, infirmier, sage-femme, kinésithérapeute, dentiste ou pharmacien. Ils peuvent vous conseiller et prescrire des substituts nicotiniques.</p><p class="lead" style="font-size:14px">Vos réponses sont anonymes : pensez à le dire vous-même à votre professionnel.</p>`:`<h1 style="font-size:28px">Merci d’avoir joué !</h1>`}
  <div class="help">Un accompagnement gratuit par des tabacologues : <b>Tabac info service</b><a class="tel" href="tel:3989">39 89</a><small>tabac-info-service.fr et application</small></div>
  <button class="btn alt" id="again">${BORNE?"Nouveau joueur":"Rejouer"}</button></div>`;
 $("again").onclick=()=>{S={i:-1,ans:[],cur:null,sent:false};render();window.scrollTo(0,0);};arm(30);}
render();
})();

</script>
</body>
</html>
